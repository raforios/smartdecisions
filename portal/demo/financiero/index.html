    <title>Análisis Financiero — SmartDecisions</title>
</head>
<body>

<main>
    <div class="container">
        <div class="sd-page-head"><div><h1>Análisis Financiero</h1>
            <p>Cómo está tu negocio, con las cifras que cargaste: lo que gana, lo que debe y hasta cuándo llega.</p></div></div>

        <section class="card">
            <div class="period-bar">
                <label class="field">
                    <span>Período</span>
                    <select id="periodSelect"></select>
                </label>
                <p class="chart-hint" id="ratesLine"></p>
                <span class="ai-slot" id="financeAi"></span>
            </div>
            <ul class="notice-list" id="notices"></ul>
        </section>

        <div class="metric-grid" id="answers"></div>

        <section class="card">
            <h3 class="chart-title">Ventas netas, egresos y utilidad por mes</h3>
            <p class="chart-hint">En bolivianos. Los egresos son el costo de ventas, los gastos de operación y el resultado financiero negativo.</p>
            <div class="chart-box"><canvas id="trendChart"></canvas></div>
        </section>
    </div>
</main>

</body>
